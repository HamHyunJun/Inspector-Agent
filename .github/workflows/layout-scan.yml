name: layout-scan

# playground 를 띄워 375/768/1280px 로 스캔한다. 기준 이상의 결함이 있으면 실패하고 요약을 job summary 에 남긴다.
# 주의: apps/playground 는 벤치마크 정답용 결함을 일부러 심어 둔 앱이라 이 저장소에서는 실패가 정상이다.
# 실제 앱에 쓸 때는 PLAYGROUND 를 앱 실행 명령과 주소로 바꾼다.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      fail-on:
        description: 이 심각도 이상의 결함이 있으면 실패 (low 는 결함이 하나라도 있으면 실패)
        type: choice
        options: [low, medium, high]
        default: low

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FAIL_ON: ${{ inputs.fail-on || 'low' }}
      SCAN_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 를 따른다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # prepare 단계에서 packages/* 가 자동 빌드된다 (탐지기 번들, CLI 포함)
      - run: pnpm install --frozen-lockfile

      - run: pnpm dlx playwright@1.56.1 install --with-deps chromium

      - name: playground 실행
        run: |
          pnpm --filter playground dev > "$RUNNER_TEMP/playground.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf "$SCAN_URL" > /dev/null && exit 0
            sleep 1
          done
          echo "playground 가 30초 안에 뜨지 않았습니다." >&2
          cat "$RUNNER_TEMP/playground.log" >&2
          exit 1

      - name: 레이아웃 스캔
        run: node packages/verifier/dist/cli.js "$SCAN_URL" --fail-on "$FAIL_ON" --summary "$GITHUB_STEP_SUMMARY"
